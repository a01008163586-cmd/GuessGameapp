name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libffi-dev libssl-dev ccache git zip unzip openjdk-17-jdk autoconf automake libtool pkg-config zlib1g-dev
        pip install --upgrade pip setuptools "buildozer>=1.5.0" kivy

    - name: Clean build cache
      run: |
        rm -rf .buildozer/android/platform/build-*

    - name: Build APK with Buildozer
      run: |
        # استخدام yes للموافقة التلقائية على التراخيص
        yes | buildozer -v android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: bin/*.apk
